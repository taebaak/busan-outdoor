# 예보 갱신 + 사이트 배포
# - 매시 25분: 기상청 단기예보(3시간마다 발표), 자외선(기상청 생활기상지수), 미세먼지(에어코리아, 매시 측정)를 받아
#   data/forecast.json, uv.json, air.json을 갱신한다. 미세먼지 측정값이 매시간 바뀌므로 1시간마다 돈다.
# - 코드를 올렸을 때(push)는 예보는 그대로 두고 사이트만 다시 배포한다.
# - 인증키는 저장소 Settings > Secrets and variables > Actions 에 저장한다.
#     KMA_SERVICE_KEY : 공공데이터포털 기상청 단기예보 키
#     VWORLD_KEY      : 브이월드 키 (배포할 때 config.js를 만들어 넣음)
name: 예보 갱신 및 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"

      - name: 기상청 예보 받기
        if: github.event_name != 'push'
        continue-on-error: true   # 기상청 응답 오류가 나도 기존 예보로 배포는 계속한다
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: python scripts/fetch_kma.py

      - name: 자외선·미세먼지 받기
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: python scripts/fetch_extra.py

      - name: 갱신된 예보 저장
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast.json data/uv.json data/air.json data/stations.json
          git diff --cached --quiet || (git commit -m "예보 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" && git push)

      - name: config.js 만들기
        env:
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
        run: |
          printf 'window.APP_CONFIG = { VWORLD_KEY: "%s" };\n' "$VWORLD_KEY" > config.js

      - name: 배포용 파일 모으기
        run: |
          mkdir _site
          cp -r index.html config.js css js data _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
